<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👨‍🍳 Painel do Restaurante</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #1a1a2e;
      color: #f0f2f5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #2d2d44);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid #ffc107;
    }

    header .logo {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .logo small {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.7;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .badge-count {
      background: #ffc107;
      color: #1a1a2e;
      border-radius: 50%;
      padding: 2px 10px;
      font-size: 13px;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .stat-card .number {
      font-size: 26px;
      font-weight: 800;
    }

    .stat-card .label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.recebido .number { color: #ffc107; }
    .stat-card.preparando .number { color: #17a2b8; }
    .stat-card.pronto .number { color: #28a745; }
    .stat-card.total .number { color: #fff; }

    .filtros {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filtro-btn {
      padding: 8px 18px;
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 25px;
      background: transparent;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .filtro-btn:hover { border-color: rgba(255,255,255,0.2); color: #fff; }
    .filtro-btn.active {
      border-color: #ffc107;
      background: rgba(255,193,7,0.15);
      color: #ffc107;
    }

    .pedidos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .pedido-card {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s;
    }

    .pedido-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.1);
    }

    .pedido-card .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .pedido-card .comanda {
      font-size: 22px;
      font-weight: 800;
    }

    .pedido-card .comanda small {
      font-size: 11px;
      font-weight: 400;
      color: #888;
      display: block;
    }

    .status-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.recebido { background: #ffc107; color: #000; }
    .status-badge.preparando { background: #17a2b8; color: #fff; }
    .status-badge.pronto { background: #28a745; color: #fff; }
    .status-badge.entregue { background: #6c757d; color: #fff; }
    .status-badge.cancelado { background: #dc3545; color: #fff; }

    .pedido-card .cliente {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .pedido-card .telefone {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .pedido-card .itens {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
    }

    .pedido-card .itens .item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .pedido-card .itens .item:last-child { border-bottom: none; }

    .pedido-card .total {
      font-size: 18px;
      font-weight: 700;
      color: #28a745;
      margin: 8px 0;
    }

    .pedido-card .tempo {
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pedido-card .tempo .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #28a745;
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .pedido-card .tempo .dot.parado {
      animation: none;
      background: #888;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .pedido-card .acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .pedido-card .acoes button {
      flex: 1;
      min-width: 60px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pedido-card .acoes button:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }

    .btn-preparar { background: #17a2b8; color: #fff; }
    .btn-pronto { background: #28a745; color: #fff; }
    .btn-entregar { background: #6c757d; color: #fff; }
    .btn-cancelar { background: #dc3545; color: #fff; }

    .pedido-card.destaque {
      border-color: #ffc107;
      animation: destaque 2s ease-in-out;
    }

    @keyframes destaque {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,193,7,0); }
      50% { box-shadow: 0 0 30px 5px rgba(255,193,7,0.15); }
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: slideUp 0.4s ease;
      max-width: 400px;
    }

    .notification.success { background: #28a745; color: #fff; }
    .notification.error { background: #dc3545; color: #fff; }
    .notification.info { background: #17a2b8; color: #fff; }
    .notification.warning { background: #ffc107; color: #000; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #loader .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #ffc107;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .pedidos-grid {
        grid-template-columns: 1fr;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      header .logo { font-size: 16px; }
      .filtros { gap: 6px; }
      .filtro-btn { padding: 6px 14px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .container { padding: 10px; }
      .pedido-card { padding: 14px; }
      .stat-card .number { font-size: 22px; }
      .pedido-card .acoes button { font-size: 11px; padding: 6px 10px; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: #ffc107; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
  </div>

  <header>
    <div class="logo">
      👨‍🍳 ASV Restaurante
      <small>| Painel de Atendimento</small>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="window.location.href='?'">🏠 Início</button>
      <button class="header-btn" onclick="carregarPedidos()">🔄 Atualizar</button>
      <span class="badge-count" id="statTotal">0</span>
    </div>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card recebido">
        <div class="number" id="statRecebidos">0</div>
        <div class="label">📥 Recebidos</div>
      </div>
      <div class="stat-card preparando">
        <div class="number" id="statPreparando">0</div>
        <div class="label">👨‍🍳 Preparando</div>
      </div>
      <div class="stat-card pronto">
        <div class="number" id="statProntos">0</div>
        <div class="label">✅ Prontos</div>
      </div>
      <div class="stat-card total">
        <div class="number" id="statTotalPedidos">0</div>
        <div class="label">📦 Total</div>
      </div>
    </div>

    <div class="filtros">
      <button class="filtro-btn active" data-filtro="todos" onclick="aplicarFiltro('todos')">📋 Todos</button>
      <button class="filtro-btn" data-filtro="recebido" onclick="aplicarFiltro('recebido')">📥 Recebidos</button>
      <button class="filtro-btn" data-filtro="preparando" onclick="aplicarFiltro('preparando')">👨‍🍳 Preparando</button>
      <button class="filtro-btn" data-filtro="pronto" onclick="aplicarFiltro('pronto')">✅ Prontos</button>
      <button class="filtro-btn" data-filtro="entregue" onclick="aplicarFiltro('entregue')">📦 Entregues</button>
    </div>

    <div id="pedidosContainer">
      <div style="text-align:center;padding:60px 20px;color:#666;">
        <div style="font-size:48px;margin-bottom:16px;">🍔</div>
        <h3 style="color:#888;">Carregando pedidos...</h3>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbxpxkZ6V4gcVE5NHuTOQhX6356jnhIm-V7RXd29taee4TPDK1x33C7zFPgBLFQ4WzcN/exec';
    const API_URL = window.location.href.split('?')[0];

    var pedidos = [];
    var filtroAtual = 'todos';
    var audioContext = null;

    document.addEventListener('DOMContentLoaded', function() {
      carregarPedidos();
      setInterval(carregarPedidos, 5000);
    });

    async function carregarPedidos() {
      try {
        var response = await fetch(BASE_URL + '?api=pedidos&_=' + Date.now());
        var data = await response.json();
        
        if (data.success && data.data) {
          var novosPedidos = data.data;
          
          if (pedidos.length > 0 && novosPedidos.length > 0) {
            var idsAtuais = pedidos.map(function(p) { return p.id; });
            
            for (var i = 0; i < novosPedidos.length; i++) {
              if (idsAtuais.indexOf(novosPedidos[i].id) === -1) {
                tocarSomNovoPedido();
                mostrarNotificacao('📦 Novo pedido #' + novosPedidos[i].comanda, 'warning');
                break;
              }
            }
          }
          
          pedidos = novosPedidos;
          renderizarPedidos();
          atualizarStats();
        }
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    function renderizarPedidos() {
      var container = document.getElementById('pedidosContainer');
      var filtrados = pedidos;
      
      if (filtroAtual !== 'todos') {
        filtrados = pedidos.filter(function(p) {
          return p.status === filtroAtual.toUpperCase();
        });
      }
      
      if (filtrados.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:60px 20px;color:#666;">
            <div style="font-size:48px;margin-bottom:16px;">🍔</div>
            <h3 style="color:#888;">Nenhum pedido ${filtroAtual !== 'todos' ? 'com status "' + filtroAtual + '"' : ''}</h3>
            <p style="color:#555;margin-top:8px;">Aguardando novos pedidos...</p>
          </div>
        `;
        return;
      }
      
      var html = '<div class="pedidos-grid">';
      
      for (var i = 0; i < filtrados.length; i++) {
        var p = filtrados[i];
        var statusClass = p.status.toLowerCase();
        var isDestaque = p.status === 'RECEBIDO' && p.tempoEspera === 'Agora';
        
        html += `
          <div class="pedido-card ${isDestaque ? 'destaque' : ''}" data-id="${p.id}">
            <div class="cabecalho">
              <div class="comanda">
                #${p.comanda}
                <small>${p.id}</small>
              </div>
              <span class="status-badge ${statusClass}">${p.statusLabel}</span>
            </div>
            
            <div class="cliente">${p.nome || 'Cliente'}</div>
            <div class="telefone">📱 ${p.telefone || 'Não informado'}</div>
            
            <div class="itens">
              ${p.itens.split(',').map(function(item) {
                return '<div class="item"><span>' + item.trim() + '</span></div>';
              }).join('')}
            </div>
            
            <div class="total">R$ ${p.valor.toFixed(2)}</div>
            
            <div class="tempo">
              <span class="dot ${p.status === 'ENTREGUE' || p.status === 'CANCELADO' ? 'parado' : ''}"></span>
              ${p.tempoEspera || 'Agora'}
              ${p.observacao ? ' | 📝 ' + p.observacao : ''}
            </div>
            
            <div class="acoes">
              ${p.status === 'RECEBIDO' ? `
                <button class="btn-preparar" onclick="mudarStatus('${p.id}', 'PREPARANDO')">👨‍🍳 Preparar</button>
                <button class="btn-cancelar" onclick="mudarStatus('${p.id}', 'CANCELADO')">❌ Cancelar</button>
              ` : ''}
              
              ${p.status === 'PREPARANDO' ? `
                <button class="btn-pronto" onclick="mudarStatus('${p.id}', 'PRONTO')">✅ Pronto</button>
                <button class="btn-cancelar" onclick="mudarStatus('${p.id}', 'CANCELADO')">❌ Cancelar</button>
              ` : ''}
              
              ${p.status === 'PRONTO' ? `
                <button class="btn-entregar" onclick="mudarStatus('${p.id}', 'ENTREGUE')">📦 Entregar</button>
              ` : ''}
            </div>
          </div>
        `;
      }
      
      html += '</div>';
      container.innerHTML = html;
    }

    function atualizarStats() {
      var recebidos = pedidos.filter(function(p) { return p.status === 'RECEBIDO'; }).length;
      var preparando = pedidos.filter(function(p) { return p.status === 'PREPARANDO'; }).length;
      var prontos = pedidos.filter(function(p) { return p.status === 'PRONTO'; }).length;
      var total = pedidos.length;
      
      document.getElementById('statRecebidos').textContent = recebidos;
      document.getElementById('statPreparando').textContent = preparando;
      document.getElementById('statProntos').textContent = prontos;
      document.getElementById('statTotalPedidos').textContent = total;
      document.getElementById('statTotal').textContent = total;
    }

    async function mudarStatus(id, novoStatus) {
      try {
        var response = await fetch(BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            api: 'atualizarStatus',
            data: { id: id, status: novoStatus }
          })
        });
        
        var result = await response.json();
        
        if (result.success) {
          mostrarNotificacao(result.mensagem, 'success');
          carregarPedidos();
        } else {
          mostrarNotificacao(result.mensagem || 'Erro ao atualizar', 'error');
        }
      } catch (error) {
        mostrarNotificacao('Erro: ' + error.message, 'error');
      }
    }

    function aplicarFiltro(filtro) {
      filtroAtual = filtro;
      
      document.querySelectorAll('.filtro-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.filtro === filtro);
      });
      
      renderizarPedidos();
    }

    function tocarSomNovoPedido() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        var osc = audioContext.createOscillator();
        var gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        osc.start(audioContext.currentTime);
        osc.stop(audioContext.currentTime + 0.3);
        
        setTimeout(function() {
          var osc2 = audioContext.createOscillator();
          var gain2 = audioContext.createGain();
          osc2.connect(gain2);
          gain2.connect(audioContext.destination);
          osc2.frequency.value = 1108;
          osc2.type = 'sine';
          gain2.gain.setValueAtTime(0.2, audioContext.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
          osc2.start(audioContext.currentTime);
          osc2.stop(audioContext.currentTime + 0.2);
        }, 150);
        
      } catch (e) {}
    }

    function mostrarNotificacao(mensagem, tipo) {
      tipo = tipo || 'info';
      
      var existing = document.querySelector('.notification');
      if (existing) existing.remove();
      
      var notif = document.createElement('div');
      notif.className = 'notification ' + tipo;
      notif.textContent = mensagem;
      
      document.body.appendChild(notif);
      
      setTimeout(function() {
        if (notif.parentElement) {
          notif.style.opacity = '0';
          notif.style.transition = 'opacity 0.5s';
          setTimeout(function() {
            if (notif.parentElement) notif.remove();
          }, 500);
        }
      }, 4000);
    }
  </script>
</body>
</html>
