<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    :root {
      --cor-fundo: #f4f6fa;
      --cor-container: #ffffff;
      --cor-texto-principal: #1e293b;
      --cor-texto-secundario: #475569;
      --cor-borda: #e9edf2;
      --cor-whatsapp: #25D366;
      --cor-pago: #10b981;
      --cor-preparando: #f59e0b;
      --cor-pronto: #3b82f6;
      --cor-entregue: #8b5cf6;
      --cor-cancelado: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cor-fundo);
      padding: 24px 16px;
      color: var(--cor-texto-principal);
    }
    .container { max-width: 900px; width: 100%; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white; padding: 24px; border-radius: 20px 20px 0 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 22px; }
    .header-count { background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 30px; font-size: 14px; }
    main { padding: 16px 24px 24px; background: var(--cor-container); border-radius: 0 0 20px 20px; }
    .pedido-card { border: 1px solid var(--cor-borda); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; }
    .pedido-info { flex: 1 1 250px; }
    .pedido-nome { font-weight: 700; font-size: 17px; }
    .pedido-tel { color: var(--cor-texto-secundario); font-size: 14px; margin-top: 4px; }
    .pedido-valor { font-weight: 800; font-size: 18px; color: #0f172a; margin-top: 6px; }
    .pedido-data { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .status-PAGO { background: rgba(16,185,129,0.1); color: var(--cor-pago); }
    .status-EM_PREPARO { background: rgba(245,158,11,0.1); color: var(--cor-preparando); }
    .status-PRONTO { background: rgba(59,130,246,0.1); color: var(--cor-pronto); }
    .status-ENTREGUE { background: rgba(139,92,246,0.1); color: var(--cor-entregue); }
    .status-CANCELADO { background: rgba(239,68,68,0.1); color: var(--cor-cancelado); }
    .pedido-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-status { border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: white; }
    .btn-pago { background: var(--cor-pago); }
    .btn-preparando { background: var(--cor-preparando); }
    .btn-pronto { background: var(--cor-pronto); }
    .btn-entregue { background: var(--cor-entregue); }
    .btn-cancelar { background: var(--cor-cancelado); }
    .whatsapp-btn { display: inline-flex; align-items: center; gap: 8px; background-color: var(--cor-whatsapp); color: white; text-decoration: none; padding: 10px 18px; border-radius: 40px; font-weight: 600; font-size: 14px; }
    .whatsapp-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .status-message { text-align: center; padding: 60px 20px; color: var(--cor-texto-secundario); }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #25D366; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>📦 Gestão de Pedidos</h1>
    <span class="header-count" id="pedido-count">0 pedidos</span>
  </header>
  <main>
    <div id="pedido-list">
      <p class="status-message"><span class="spinner"></span><br>Carregando pedidos...</p>
    </div>
  </main>
</div>

<script>
  const DDI = '55';
  let allPedidos = [];

  document.addEventListener('DOMContentLoaded', initializeApp);
  function initializeApp() {
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onDataError)
      .getPedidos();
  }

  function onDataLoaded(pedidos) {
    allPedidos = pedidos;
    renderPedidoList(pedidos);
    document.getElementById('pedido-count').textContent = `${pedidos.length} pedidos`;
  }

  function onDataError(error) {
    document.getElementById('pedido-list').innerHTML = `<p class="status-message">❌ ${error.message}</p>`;
  }

  function renderPedidoList(pedidos) {
    const container = document.getElementById('pedido-list');
    container.innerHTML = '';
    if (pedidos.length === 0) {
      container.innerHTML = '<p class="status-message">Nenhum pedido encontrado.</p>';
      return;
    }

    pedidos.forEach(pedido => {
      const card = document.createElement('div');
      card.className = 'pedido-card';
      const status = pedido.status || 'PEDIDO_REALIZADO';
      const numeroComDDI = DDI + pedido.telefone;
      const whatsappLink = `https://wa.me/${numeroComDDI}?text=${encodeURIComponent('Olá ' + pedido.nome + ', seu pedido ' + pedido.id + ' está ' + status + '!')}`;

      card.innerHTML = `
        <div class="pedido-info">
          <div class="pedido-nome">#${pedido.id} - ${pedido.nome}</div>
          <div class="pedido-tel">📱 ${pedido.telefone}</div>
          <div class="pedido-valor">💰 R$ ${parseFloat(pedido.valor).toFixed(2)}</div>
          <div class="pedido-data">📅 ${new Date(pedido.data).toLocaleString('pt-BR')}</div>
          <span class="status-badge status-${status.replace(/ /g, '_')}">${status}</span>
        </div>
        <div class="pedido-actions">
          <button class="btn-status btn-pago" onclick="atualizarStatus('${pedido.id}', 'PAGO')">Pago</button>
          <button class="btn-status btn-preparando" onclick="atualizarStatus('${pedido.id}', 'EM_PREPARO')">Preparando</button>
          <button class="btn-status btn-pronto" onclick="atualizarStatus('${pedido.id}', 'PRONTO')">Pronto</button>
          <button class="btn-status btn-entregue" onclick="atualizarStatus('${pedido.id}', 'ENTREGUE')">Entregue</button>
          <button class="btn-status btn-cancelar" onclick="atualizarStatus('${pedido.id}', 'CANCELADO')">Cancelar</button>
          <a class="whatsapp-btn" href="${whatsappLink}" target="_blank">WhatsApp</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function atualizarStatus(orderId, novoStatus) {
    google.script.run
      .withSuccessHandler(() => { initializeApp(); })
      .withFailureHandler((err) => { alert('Erro ao atualizar: ' + err.message); })
      .atualizarStatusPedido(orderId, novoStatus);
  }
</script>
</body>
</html>
