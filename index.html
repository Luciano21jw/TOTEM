<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Sabor Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #FF5733; /* Laranja */
            --cor-secundaria: #2C3E50; /* Azul Escuro */
            --cor-fundo: #F4F4F4;
            --cor-branca: #FFFFFF;
            --cor-verde: #28A745;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .totem {
            width: 420px; height: 850px; background-color: var(--cor-fundo);
            border-radius: 20px; position: relative; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 8px solid var(--cor-secundaria);
            display: flex; flex-direction: column;
        }

        .tela { display: none; flex-direction: column; height: 100%; width: 100%; }
        .tela.ativa { display: flex; }

        /* TELA 1: HOME */
        #home { background: linear-gradient(135deg, var(--cor-primaria), #ff8c42); align-items: center; justify-content: center; text-align: center; color: white; padding: 20px; }
        .logo-marca { font-size: 50px; font-weight: 800; margin-bottom: 20px; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .banner-home { font-size: 80px; margin-bottom: 30px; }
        .botao-iniciar { background: var(--cor-branca); color: var(--cor-secundaria); border: none; padding: 20px 40px; font-size: 20px; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* TELA 2: ESCOLHA */
        #escolha { background-color: var(--cor-branca); align-items: center; padding-top: 50px; }
        .titulo-escolha { font-size: 28px; font-weight: 800; color: var(--cor-secundaria); margin-bottom: 40px; }
        .opcoes { display: flex; gap: 15px; width: 90%; }
        .botao-opcao { flex: 1; height: 250px; background-color: var(--cor-fundo); border: 3px solid #ddd; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-size: 16px; font-weight: 800; color: var(--cor-secundaria); transition: 0.2s; }
        .botao-opcao:hover { border-color: var(--cor-primaria); background-color: #fff; }
        .icone-opcao { font-size: 70px; background: white; padding: 20px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* TELA 3: CARDÁPIO */
        #cardapio { background-color: var(--cor-fundo); }
        .header-cardapio { background-color: var(--cor-secundaria); color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; position: relative; }
        .botao-voltar { position: absolute; left: 15px; top: 15px; background: none; border: 2px solid white; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        
        .area-produtos { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
        .produto { background: var(--cor-branca); border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .icone-produto { font-size: 45px; margin: 10px auto; }
        .nome-produto { font-weight: bold; font-size: 13px; color: var(--cor-secundaria); margin-bottom: 5px; }
        .preco-produto { font-size: 16px; font-weight: 800; color: var(--cor-primaria); margin-bottom: 8px; }
        .adicionar-btn { background: var(--cor-secundaria); color: white; border: none; border-radius: 6px; padding: 8px; cursor: pointer; font-weight: bold; }

        /* RODAPÉ CARDÁPIO / CARRINHO */
        .rodape-cardapio { background: var(--cor-branca); padding: 12px; border-top: 2px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .linha-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--cor-secundaria); }
        .botoes-rodape { display: flex; gap: 10px; }
        .botao-limpar { flex: 1; background: #eee; border: none; border-radius: 5px; padding: 10px; cursor: pointer; color: #333; font-weight: bold; }
        .botao-finalizar { flex: 2; background: var(--cor-verde); color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; font-weight: 800; }

        /* TELA 4: SUCESSO */
        #sucesso { background: var(--cor-verde); color: white; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .icone-sucesso { font-size: 100px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="totem">
    
    <!-- TELA HOME -->
    <div id="home" class="tela ativa">
        <div class="logo-marca">SABOR TOTAL</div>
        <div class="banner-home">🍔🧡</div>
        <p style="margin-bottom: 30px;">Peça aqui com cartão ou dinheiro</p>
        <button class="botao-iniciar" onclick="navegar('escolha')">TOQUE PARA COMEÇAR</button>
    </div>

    <!-- TELA ESCOLHA -->
    <div id="escolha" class="tela">
        <h2 class="titulo-escolha">Como deseja receber?</h2>
        <div class="opcoes">
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🍽️</div>
                Comer no local
            </button>
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🛍️</div>
                Para levar
            </button>
        </div>
    </div>

    <!-- TELA CARDÁPIO -->
    <div id="cardapio" class="tela">
        <div class="header-cardapio">
            <button class="botao-voltar" onclick="navegar('escolha')">&larr; Voltar</button>
            NOSSO CARDÁPIO
        </div>
        
        <div class="area-produtos" id="listaProdutos">
            <!-- Os produtos da planilha aparecerão aqui -->
            <p style="grid-column: span 2; text-align: center; margin-top: 50px;">Carregando cardápio...</p>
        </div>

        <div class="rodape-cardapio">
            <div class="linha-total">
                <span>Total:</span>
                <span id="totalCarrinho">R$ 0,00</span>
            </div>
            <div class="botoes-rodape">
                <button class="botao-limpar" onclick="limparCarrinho()">Limpar</button>
                <button class="botao-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <!-- TELA SUCESSO -->
    <div id="sucesso" class="tela">
        <div class="icone-sucesso">✅</div>
        <h2>Pedido Realizado!</h2>
        <p style="margin-top: 15px;">Retire seu pedido no balcão.</p>
        <button class="botao-limpar" style="margin-top: 30px; width: 60%;" onclick="navegar('home')">Voltar ao Início</button>
    </div>

</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DA PLANILHA (IMPORTANTE)
    // 👇👇👇 COLE O SEU LINK DO EXCEL AQUI 👇👇👇
    
    const URL_DA_PLANILHA = "COLE_SEU_LINK_AQUI"; 
    
    // 👆👆👆 COLE O SEU LINK DO EXCEL AQUI 👆👆👆
    // ==========================================

    let carrinho = [];
    let produtos = [];

    // Função para buscar dados da planilha do Google
    async function carregarPlanilha() {
        try {
            // O Google Sheets retorna os dados em formato CSV
            const resposta = await fetch(URL_DA_PLANILHA);
            const csv = await resposta.text();

            // Converte o CSV em um array de objetos
            const linhas = csv.split('\n').filter(linha => linha.trim() !== '');
            const cabecalhos = linhas[0].split(',');

            produtos = linhas.slice(1).map(linha => {
                const colunas = linha.split(',');
                return {
                    nome: colunas[0]?.trim(),
                    preco: parseFloat(colunas[1]?.replace('.', '.').trim()),
                    icone: colunas[2]?.trim() || '🍽️',
                    categoria: colunas[3]?.trim() || 'Geral'
                };
            }).filter(p => !isNaN(p.preco)); // Filtra linhas vazias ou com preço inválido

            renderizarCardapio();

        } catch (erro) {
            console.error("Erro ao carregar planilha:", erro);
            document.getElementById('listaProdutos').innerHTML = '<p style="grid-column: span 2; text-align: center; color: red; margin-top: 50px;">Erro ao carregar. Verifique o link da planilha.</p>';
        }
    }

    // Função para desenhar os produtos na tela
    function renderizarCardapio() {
        const container = document.getElementById('listaProdutos');
        container.innerHTML = '';

        produtos.forEach((produto, index) => {
            const div = document.createElement('div');
            div.className = 'produto';
            div.innerHTML = `
                <div class="icone-produto">${produto.icone}</div>
                <div class="nome-produto">${produto.nome}</div>
                <div class="preco-produto">R$ ${produto.preco.toFixed(2)}</div>
                <button class="adicionar-btn" onclick="adicionarAoCarrinho(${index})">Adicionar</button>
            `;
            container.appendChild(div);
        });
    }

    // Lógica do Carrinho
    function adicionarAoCarrinho(index) {
        const produto = produtos[index];
        carrinho.push(produto);
        atualizarTotal();
    }

    function limparCarrinho() {
        carrinho = [];
        atualizarTotal();
    }

    function atualizarTotal() {
        let total = 0;
        carrinho.forEach(item => total += item.preco);
        document.getElementById('totalCarrinho').innerText = `R$ ${total.toFixed(2)}`;
    }

    function finalizarPedido() {
        if (carrinho.length === 0) {
            alert("Adicione pelo menos um item ao carrinho!");
            return;
        }
        // Aqui você poderia enviar o pedido para um sistema. Por enquanto só mostra a tela de sucesso
        navegar('sucesso');
        limparCarrinho();
    }

    // Navegação entre telas
    function navegar(idTela) {
        document.querySelectorAll('.tela').forEach(tela => tela.classList.remove('ativa'));
        document.getElementById(idTela).classList.add('ativa');
    }

    // Iniciar o sistema
    window.onload = carregarPlanilha;
</script>

</body>
</html>
