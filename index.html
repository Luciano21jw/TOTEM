<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Sabor Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primaria: #FF5733; --secundaria: #2C3E50; --fundo: #F4F4F4; --branco: #FFF; --verde: #00e676; --amarelo: #ffc107; --vermelho: #ff5252; --cinza: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .totem { width: 420px; height: 850px; background: var(--fundo); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 8px solid var(--secundaria); display: flex; flex-direction: column; position: relative; }
        .tela { display: none; flex-direction: column; height: 100%; width: 100%; }
        .tela.ativa { display: flex; }
        #home { background: linear-gradient(135deg, var(--primaria), #ff8c42); align-items: center; justify-content: center; text-align: center; color: white; }
        .logo-marca { font-size: 50px; font-weight: 800; margin-bottom: 20px; }
        .banner-home { font-size: 80px; margin-bottom: 30px; }
        .botao-iniciar { background: white; color: var(--secundaria); border: none; padding: 20px 40px; font-size: 20px; font-weight: 800; border-radius: 50px; cursor: pointer; transition: transform 0.2s; }
        .botao-iniciar:hover { transform: scale(1.05); }
        #escolha { background: white; align-items: center; justify-content: center; padding: 20px; }
        .titulo-escolha { font-size: 28px; font-weight: 800; color: var(--secundaria); margin-bottom: 40px; }
        .opcoes { display: flex; gap: 15px; width: 100%; }
        .botao-opcao { flex: 1; height: 250px; background: var(--fundo); border: 3px solid #ddd; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-weight: 800; color: var(--secundaria); transition: 0.3s; }
        .botao-opcao:hover { border-color: var(--primaria); background: #fff; }
        .icone-opcao { font-size: 70px; background: white; padding: 20px; border-radius: 50%; }
        #cardapio { background: var(--fundo); }
        .header-cardapio { background: var(--secundaria); color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: relative; display: flex; align-items: center; justify-content: center; }
        .botao-voltar { position: absolute; left: 15px; top: 15px; background: none; border: 2px solid white; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .botao-voltar:hover { background: white; color: var(--secundaria); }
        .categorias-bar { display: flex; background: white; padding: 10px; gap: 10px; overflow-x: auto; border-bottom: 1px solid #ddd; }
        .cat-btn { padding: 8px 15px; background: #f0f0f0; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.2s; }
        .cat-btn.ativa { background: var(--primaria); color: white; }
        .area-produtos { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
        .produto { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .produto:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .icone-produto { font-size: 45px; margin: 10px auto; height: 60px; display: flex; align-items: center; justify-content: center; }
        .icone-produto img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .nome-produto { font-weight: bold; font-size: 13px; color: var(--secundaria); margin-bottom: 5px; }
        .preco-produto { font-size: 16px; font-weight: 800; color: var(--primaria); margin-bottom: 8px; }
        .adicionar-btn { background: var(--secundaria); color: white; border: none; border-radius: 6px; padding: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .adicionar-btn:hover { background: var(--primaria); }
        .rodape-cardapio { background: white; padding: 12px; border-top: 2px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .linha-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--secundaria); }
        .botoes-rodape { display: flex; gap: 10px; }
        .botao-limpar { flex: 1; background: #eee; border: none; border-radius: 5px; padding: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .botao-limpar:hover { background: #ddd; }
        .botao-finalizar { flex: 2; background: var(--verde); color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; font-weight: 800; transition: 0.2s; }
        .botao-finalizar:hover { background: #00c853; }
        #pix { background: var(--fundo); align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto; }
        .pix-header { text-align: center; margin-bottom: 10px; width: 100%; }
        .pix-header .client-name { font-size: 1.1rem; font-weight: 700; color: var(--secundaria); }
        .pix-header .pix-amount { font-size: 2.5rem; font-weight: 900; color: var(--primaria); margin: 5px 0; letter-spacing: -1px; }
        #statusPagamento { width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; text-align: center; margin-bottom: 10px; transition: all 0.3s; }
        .status-pendente { background: rgba(255,193,7,0.1); color: var(--amarelo); border: 1px solid rgba(255,193,7,0.3); }
        .status-pago { background: rgba(0,230,118,0.1); color: var(--verde); border: 1px solid rgba(0,230,118,0.3); animation: pulseGreen 1s infinite; }
        @keyframes pulseGreen { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .status-temporizador { font-size: 0.8rem; color: var(--cinza); text-align: center; margin-bottom: 15px; }
        .qr-container { background: white; padding: 15px; margin: 0 auto 15px; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid transparent; transition: 0.3s; }
        .qr-container.confirmed { border-color: var(--verde); box-shadow: 0 0 30px rgba(0,230,118,0.2); }
        .pix-code-copy { background: var(--branco); padding: 10px; border-radius: 8px; font-size: 0.7rem; color: var(--cinza); word-break: break-all; cursor: pointer; border: 1px solid #ddd; text-align: center; font-family: monospace; width: 100%; margin-bottom: 15px; transition: 0.3s; }
        .pix-code-copy:hover { border-color: var(--primaria); color: var(--primaria); }
        .check-writing-container { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 10px; margin-bottom: 15px; border-radius: 12px; background: rgba(0,230,118,0.05); border: 2px solid transparent; width: 100%; }
        .check-writing-container.visivel { display: flex; border-color: var(--verde); }
        .check-svg { width: 70px; height: 70px; margin-bottom: 5px; }
        .check-svg .check-path { fill: none; stroke: var(--verde); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawCheck 1.2s ease-in-out forwards; }
        @keyframes drawCheck { 0% { stroke-dashoffset: 100; opacity: 0; } 10% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
        .check-writing-container .texto-confirmacao { color: var(--verde); font-weight: 800; font-size: 1.2rem; margin-top: 5px; opacity: 0; animation: fadeText 0.5s ease-in-out 1s forwards; }
        @keyframes fadeText { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .footer-actions { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        .botao-nova-venda { flex: 1; background: var(--secundaria); color: white; border: none; border-radius: 10px; padding: 12px; cursor: pointer; font-weight: 700; font-size: 16px; transition: 0.3s; }
        .botao-nova-venda:hover { background: var(--primaria); }
        .botao-cancelar-venda { flex: 1; background: rgba(255,82,82,0.1); color: var(--vermelho); border: 1px solid rgba(255,82,82,0.2); border-radius: 10px; padding: 12px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.3s; }
        .botao-cancelar-venda:hover { background: rgba(255,82,82,0.2); }
        .btn-testar { background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; transition: 0.3s; }
        .btn-testar:hover { background: #45a049; }
        .btn-testar-email { background: #2196F3; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; margin-left: 10px; transition: 0.3s; }
        .btn-testar-email:hover { background: #1976D2; }
        .debug-info { background: #333; color: #00ff00; padding: 10px; border-radius: 8px; font-size: 12px; font-family: monospace; width: 100%; margin-top: 10px; display: none; max-height: 100px; overflow-y: auto; }
        .debug-info.visivel { display: block; }
        .btn-testar-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="totem">
    <div id="home" class="tela ativa">
        <div class="logo-marca">SABOR TOTAL</div>
        <div class="banner-home">🍔🔥</div>
        <button class="botao-iniciar" onclick="navegar('escolha')">TOQUE PARA COMEÇAR</button>
        <div class="btn-testar-container">
            <button class="btn-testar" onclick="testarConexao()">🔧 Testar Sistema</button>
            <button class="btn-testar-email" onclick="testarVerificacaoEmail()">📧 Testar Email</button>
        </div>
        <div id="debugInfo" class="debug-info"></div>
    </div>

    <div id="escolha" class="tela">
        <h2 class="titulo-escolha">Como deseja receber?</h2>
        <div class="opcoes">
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🍽️</div> Comer no local
            </button>
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🛍️</div> Para levar
            </button>
        </div>
    </div>

    <div id="cardapio" class="tela">
        <div class="header-cardapio">
            <button class="botao-voltar" onclick="navegar('escolha')">&larr; Voltar</button>
            NOSSO CARDÁPIO
        </div>
        <div class="categorias-bar" id="barraCategorias"></div>
        <div class="area-produtos" id="listaProdutos"></div>
        <div class="rodape-cardapio">
            <div class="linha-total"><span>Total:</span><span id="totalCarrinho">R$ 0,00</span></div>
            <div class="botoes-rodape">
                <button class="botao-limpar" onclick="limparCarrinho()">Limpar</button>
                <button class="botao-finalizar" onclick="irParaPagamento()">Pagar</button>
            </div>
        </div>
    </div>

    <div id="pix" class="tela">
        <div class="pix-header">
            <div class="client-name" id="displayCliente">Cliente</div>
            <div class="pix-amount">R$ <span id="displayValor">0,00</span></div>
        </div>
        <div id="checkWritingContainer" class="check-writing-container">
            <svg class="check-svg" viewBox="0 0 80 80">
                <path class="check-path" d="M 15 40 L 35 60 L 70 20" />
            </svg>
            <span class="texto-confirmacao">PAGAMENTO CONFIRMADO!</span>
        </div>
        <div id="statusPagamento" class="status-pendente">⏳ Aguardando pagamento...</div>
        <div id="temporizador" class="status-temporizador">⏱️ Verificando automaticamente...</div>
        <div class="qr-container" id="qrContainer">
            <div id="qrcode"></div>
        </div>
        <div class="pix-code-copy" id="pixCodeTexto" onclick="copiarPix()">📋 Clique para copiar o código Pix</div>
        <div class="footer-actions">
            <button class="botao-cancelar-venda" onclick="cancelarPedido()">Cancelar</button>
            <button class="botao-nova-venda" id="btnNovaVenda" style="display:none;" onclick="navegar('home')">Nova Venda</button>
        </div>
        <div style="margin-top:10px;width:100%;text-align:center;font-size:12px;color:#999;">
            ⏱️ Verificação a cada 5 segundos
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  COLOQUE SUA URL DO WEB APP AQUI (A URL QUE VOCÊ ME PASSOU)
    // ============================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVXrCFdixHlB9WGYB_bF8-StRL-R9qAhEbL8r3eJj4m1JsVzXNR-2Vt_mYdkE6sGpG/exec";

    let carrinho = [];
    let produtos = [];
    let categoriaAtiva = "Todos";
    let timerVerificacao = null;
    let timerInterval = null;
    let totalPedido = 0;
    let vendaConfirmada = false;
    let pedidoAtualID = "";

    // Função JSONP para chamar o Web App
    function jsonp(url, cb) {
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => { 
                delete window[cb]; 
                reject(new Error('Timeout - Verifique sua conexão com a internet')); 
            }, 15000);
            
            window[cb] = function(data) { 
                clearTimeout(timeout); 
                resolve(data); 
                delete window[cb]; 
            };
            
            const s = document.createElement('script');
            s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
            s.onerror = () => { 
                clearTimeout(timeout); 
                reject(new Error('Erro ao carregar o script')); 
            };
            document.body.appendChild(s);
        });
    }

    // ============================================================
    //  TESTAR CONEXÃO
    // ============================================================
    async function testarConexao() {
        const debug = document.getElementById('debugInfo');
        debug.classList.add('visivel');
        debug.innerHTML = '⏳ Testando configurações...\n';
        
        try {
            const data = await jsonp(SCRIPT_URL + '?action=testarConfiguracao', 'cb_test_' + Date.now());
            if (data && data.success) {
                debug.innerHTML += '✅ Conexão OK!\n';
                debug.innerHTML += '📌 Chave PIX: ' + data.chave + '\n';
                debug.innerHTML += '📌 Nome: ' + data.nome + '\n';
                debug.innerHTML += '📌 Cidade: ' + data.cidade + '\n';
                alert('✅ Sistema configurado corretamente!');
            } else {
                debug.innerHTML += '❌ Erro: ' + (data?.mensagem || 'Configuração não encontrada') + '\n';
                alert('❌ ' + (data?.mensagem || 'Configuração não encontrada'));
            }
        } catch (e) {
            debug.innerHTML += '❌ Erro de conexão: ' + e.message + '\n';
            alert('❌ Erro de conexão: ' + e.message);
        }
    }

    // ============================================================
    //  TESTAR VERIFICAÇÃO DE EMAIL
    // ============================================================
    async function testarVerificacaoEmail() {
        const debug = document.getElementById('debugInfo');
        debug.classList.add('visivel');
        debug.innerHTML = '⏳ Verificando pagamento...\n';
        
        try {
            const data = await jsonp(SCRIPT_URL + '?action=verificarPagamento', 'cb_email_' + Date.now());
            debug.innerHTML += '📧 Resposta: ' + JSON.stringify(data) + '\n';
            
            if (data && data.confirmado) {
                debug.innerHTML += '✅ PAGAMENTO CONFIRMADO!\n';
                alert('✅ Pagamento confirmado por email!');
                confirmarPagamento();
            } else {
                debug.innerHTML += '⚠️ Nenhum pagamento encontrado.\n';
                alert('⚠️ Nenhum pagamento confirmado encontrado.');
            }
        } catch (e) {
            debug.innerHTML += '❌ Erro: ' + e.message + '\n';
            alert('❌ Erro ao verificar: ' + e.message);
        }
    }

    // ============================================================
    //  CARREGAR PRODUTOS
    // ============================================================
    async function carregarProdutos() {
        try {
            const data = await jsonp(SCRIPT_URL + '?action=getProdutos', 'cb_prod_' + Date.now());
            if (data && data.success && Array.isArray(data.data)) {
                produtos = data.data.map(p => ({
                    nome: p.nome, 
                    preco: parseFloat(p.preco), 
                    imagem: p.imagem, 
                    status: p.status, 
                    categoria: p.categoria || "Geral"
                }));
                console.log('✅ Produtos carregados:', produtos.length);
            } else {
                produtos = [];
                console.warn('⚠️ Nenhum produto encontrado');
            }
        } catch (e) {
            produtos = [];
            console.error('❌ Erro ao carregar produtos:', e);
        }
        criarBarraCategorias();
        renderizarCardapio();
    }

    function criarBarraCategorias() {
        const barra = document.getElementById('barraCategorias');
        const cats = [...new Set(produtos.filter(p => p.status === "ATIVO").map(p => p.categoria))];
        barra.innerHTML = `<button class="cat-btn ativa" onclick="filtrar('Todos', this)">Todos</button>`;
        cats.forEach(c => { 
            if(c) barra.innerHTML += `<button class="cat-btn" onclick="filtrar('${c}', this)">${c}</button>`; 
        });
    }

    function filtrar(cat, btn) {
        categoriaAtiva = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ativa'));
        btn.classList.add('ativa');
        renderizarCardapio();
    }

    function renderizarCardapio() {
        const container = document.getElementById('listaProdutos');
        container.innerHTML = '';
        const ativos = produtos.filter(p => p.status === "ATIVO");
        const filtrados = categoriaAtiva === "Todos" ? ativos : ativos.filter(p => p.categoria === categoriaAtiva);
        
        if (filtrados.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#888;">Nenhum produto disponível</div>';
            return;
        }
        
        filtrados.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'produto';
            const imagemHtml = p.imagem ? `<img src="${p.imagem}">` : '🍽️';
            div.innerHTML = `
                <div class="icone-produto">${imagemHtml}</div>
                <div class="nome-produto">${p.nome}</div>
                <div class="preco-produto">R$ ${p.preco.toFixed(2)}</div>
                <button class="adicionar-btn" onclick="adicionar(${i})">Adicionar</button>
            `;
            container.appendChild(div);
        });
    }

    function adicionar(index) {
        const ativos = produtos.filter(p => p.status === "ATIVO");
        const filtrados = categoriaAtiva === "Todos" ? ativos : ativos.filter(p => p.categoria === categoriaAtiva);
        const p = filtrados[index];
        if (p) { 
            carrinho.push(p); 
            atualizarTotal();
            const btn = event.target;
            btn.textContent = '✅';
            setTimeout(() => btn.textContent = 'Adicionar', 800);
        }
    }

    function limparCarrinho() { 
        carrinho = []; 
        atualizarTotal(); 
    }

    function atualizarTotal() {
        let total = 0;
        carrinho.forEach(p => total += p.preco);
        document.getElementById('totalCarrinho').innerText = `R$ ${total.toFixed(2)}`;
    }

    // ============================================================
    //  GERAR PIX E SALVAR PEDIDO (AGORA VIA JSONP)
    // ============================================================
    async function irParaPagamento() {
        if (carrinho.length === 0) {
            alert("Adicione itens ao carrinho!");
            return;
        }
        
        let total = 0;
        let itens = "";
        carrinho.forEach(p => { 
            total += p.preco; 
            itens += p.nome + ", "; 
        });
        totalPedido = total;

        const url = `${SCRIPT_URL}?action=saveOrder&valor=${total.toFixed(2)}&nome=Cliente%20Totem&itens=${encodeURIComponent(itens)}`;
        
        try {
            const resposta = await jsonp(url, 'cb_venda_' + Date.now());
            
            if (resposta && resposta.success) {
                pedidoAtualID = resposta.orderId;
                mostrarPix(resposta.pixCode, total);
            } else {
                alert("❌ Erro ao gerar PIX: " + (resposta?.erro || "Erro desconhecido"));
            }
        } catch (e) {
            alert("❌ Erro de conexão: " + e.message);
        }
    }

    // ============================================================
    //  MOSTRAR PIX E QR CODE
    // ============================================================
    function mostrarPix(code, valor) {
        navegar('pix');
        vendaConfirmada = false;
        
        document.getElementById('displayValor').innerText = valor.toFixed(2).replace('.', ',');
        document.getElementById('statusPagamento').className = 'status-pendente';
        document.getElementById('statusPagamento').innerText = "⏳ Aguardando pagamento...";
        document.getElementById('temporizador').innerText = "⏱️ Verificando automaticamente...";
        document.getElementById('checkWritingContainer').classList.remove('visivel');
        document.getElementById('qrContainer').classList.remove('confirmed');
        document.getElementById('btnNovaVenda').style.display = 'none';
        document.getElementById('pixCodeTexto').innerText = code;
        window.pixCodeGlobal = code;

        // Gerar QR Code
        const qrDiv = document.getElementById('qrcode');
        qrDiv.innerHTML = '';
        try {
            new QRCode(qrDiv, { text: code, width: 170, height: 170 });
        } catch (e) {
            qrDiv.innerHTML = '<div style="font-size:12px;color:red;">Erro ao gerar QR Code</div>';
        }

        // Timer de 5 minutos
        if (timerInterval) clearInterval(timerInterval);
        if (timerVerificacao) clearTimeout(timerVerificacao);
        
        let seg = 0;
        const max = 300;
        timerInterval = setInterval(() => {
            seg++;
            if (seg >= max && !vendaConfirmada) {
                clearInterval(timerInterval);
                document.getElementById('temporizador').innerText = "⏰ Tempo esgotado. Faça um novo pedido.";
            } else if (!vendaConfirmada) {
                const m = Math.floor(seg / 60);
                const s = seg % 60;
                document.getElementById('temporizador').innerText = `⏱️ Aguardando... ${m}m ${s}s`;
            }
        }, 1000);

        // Iniciar verificação automática do pedido específico
        iniciarVerificacao();
    }

    function iniciarVerificacao() {
        if (vendaConfirmada) return;
        
        const verificar = async () => {
            if (vendaConfirmada) return;
            
            // Chama a função verificarStatusPedido com o ID do pedido salvo
            try {
                const status = await jsonp(SCRIPT_URL + '?action=pedido&id=' + pedidoAtualID, 'cb_status_' + Date.now());
                
                if (status && status.success && status.data && status.data.status === 'PAGO') {
                    confirmarPagamento();
                    return;
                }
            } catch (e) {
                console.log('⚠️ Erro na verificação:', e.message);
            }
            
            // Tenta novamente em 5 segundos
            if (!vendaConfirmada) {
                timerVerificacao = setTimeout(verificar, 5000);
            }
        };
        
        // Primeira verificação após 2 segundos
        timerVerificacao = setTimeout(verificar, 2000);
    }

    function confirmarPagamento() {
        if (vendaConfirmada) return;
        vendaConfirmada = true;
        
        clearInterval(timerInterval);
        clearTimeout(timerVerificacao);
        
        document.getElementById('statusPagamento').className = 'status-pago';
        document.getElementById('statusPagamento').innerText = "✅ Pagamento confirmado!";
        document.getElementById('temporizador').innerText = "✅ Pedido liberado!";
        document.getElementById('qrContainer').classList.add('confirmed');
        
        const c = document.getElementById('checkWritingContainer');
        c.classList.add('visivel');
        const path = c.querySelector('.check-path');
        path.style.animation = 'none';
        path.offsetHeight;
        path.style.animation = 'drawCheck 1.2s ease-in-out forwards';
        
        setTimeout(() => { 
            document.getElementById('btnNovaVenda').style.display = 'block'; 
        }, 1500);
        
        limparCarrinho();
        
        if (Notification.permission === "granted") {
            new Notification("✅ Pagamento Confirmado!", {
                body: "Seu pedido foi liberado!",
                icon: "https://img.icons8.com/color/48/000000/checkmark--v1.png"
            });
        }
    }

    function copiarPix() { 
        if (window.pixCodeGlobal) {
            navigator.clipboard.writeText(window.pixCodeGlobal).then(() => {
                alert('📋 Código PIX copiado!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = window.pixCodeGlobal;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('📋 Código PIX copiado!');
            });
        }
    }

    function cancelarPedido() {
        if (confirm("Deseja cancelar este pedido?")) {
            clearInterval(timerInterval);
            clearTimeout(timerVerificacao);
            vendaConfirmada = false;
            limparCarrinho();
            navegar('home');
        }
    }

    function navegar(id) { 
        document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); 
        document.getElementById(id).classList.add('ativa'); 
    }

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================
    window.onload = function() {
        carregarProdutos();
        
        if (Notification.permission === "default") {
            Notification.requestPermission();
        }
    };
</script>
</body>
</html>
