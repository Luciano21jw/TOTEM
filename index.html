<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totem Sabor Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--prim:#ff5733;--dark:#243447;--bg:#f4f5f7;--green:#00b86b;--yellow:#f5a400;--red:#e53935}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,Arial,sans-serif}
body{background:#16191d;min-height:100vh;display:flex;align-items:center;justify-content:center}
.totem{width:420px;height:850px;max-width:100vw;max-height:100vh;background:var(--bg);overflow:hidden;border:8px solid var(--dark);border-radius:22px;box-shadow:0 18px 50px #0008;display:flex;flex-direction:column}
.tela{display:none;width:100%;height:100%;flex-direction:column}.tela.ativa{display:flex}
#home{align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(135deg,var(--prim),#ff8c42);padding:25px}
.logo{font-size:42px;font-weight:800}.hero{font-size:78px;margin:25px 0}
.btn-start,.btn{border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:800;cursor:pointer}
.btn-start{background:#fff;color:var(--dark);border-radius:50px;padding:18px 35px}
.small-status{font-size:11px;margin-top:15px;opacity:.8}
#escolha{background:#fff;align-items:center;justify-content:center;padding:22px}
h2{color:var(--dark);font-size:26px;margin-bottom:28px;text-align:center}
.opcoes{display:flex;gap:12px;width:100%}.opcao{flex:1;height:220px;background:var(--bg);border:3px solid #ddd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;color:var(--dark);cursor:pointer}
.opcao:hover{border-color:var(--prim)}.ico{font-size:58px}
#cardapio{background:var(--bg)}
.top{background:var(--dark);color:#fff;padding:14px;position:relative;text-align:center;font-weight:800}
.back{position:absolute;left:12px;top:10px;background:transparent;color:#fff;border:1px solid #fff;border-radius:20px;padding:5px 12px;cursor:pointer}
.cats{display:flex;gap:8px;padding:10px;background:#fff;overflow:auto;border-bottom:1px solid #ddd}
.cat{border:0;border-radius:20px;padding:7px 13px;white-space:nowrap;font-weight:700;cursor:pointer}.cat.on{background:var(--prim);color:#fff}
.produtos{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.produto{background:#fff;border-radius:12px;padding:9px;text-align:center;box-shadow:0 2px 7px #0001}
.prod-img{width:70px;height:70px;margin:5px auto 8px;border-radius:10px;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;font-size:38px}
.prod-nome{font-weight:800;color:var(--dark);font-size:13px;min-height:38px}.prod-desc{font-size:10px;color:#777;height:28px;overflow:hidden}.preco{color:var(--prim);font-weight:800;font-size:16px;margin:5px}
.add{width:100%;background:var(--dark);color:#fff;border:0;border-radius:7px;padding:8px;font-weight:700;cursor:pointer}
.rodape{background:#fff;border-top:2px solid #ddd;padding:10px}.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;color:var(--dark);margin-bottom:8px}.acoes{display:flex;gap:8px}.limpar{flex:1;background:#eee;border:0;border-radius:8px;font-weight:700}.pagar{flex:2;background:var(--green);color:#fff;border:0;border-radius:8px;font-weight:800;padding:11px}
#pix{background:var(--bg);align-items:center;padding:18px;overflow:auto}.pix-title{color:var(--dark);font-weight:800;text-align:center}.valor{font-size:38px;color:var(--prim);font-weight:800;text-align:center;margin:3px 0 10px}
.status{width:100%;padding:12px;border-radius:10px;text-align:center;font-weight:800;margin-bottom:8px}.pend{background:#fff6db;color:var(--yellow)}.pago{background:#dff9ed;color:var(--green)}
.qr{background:#fff;padding:12px;border-radius:14px;margin:10px auto;width:194px;height:194px;display:flex;align-items:center;justify-content:center}
.code{width:100%;background:#fff;border:1px solid #ddd;border-radius:9px;padding:10px;font:11px monospace;word-break:break-all;text-align:center;cursor:pointer}
.timer{font-size:11px;color:#777;margin:8px}.pix-actions{display:flex;gap:8px;width:100%;margin-top:10px}.cancel{flex:1;background:#ffe8e8;color:var(--red);border:0;border-radius:9px;padding:11px;font-weight:800}.new{flex:1;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:800;display:none}
.form{background:#fff;padding:12px;border-bottom:1px solid #ddd;display:grid;grid-template-columns:1fr 1fr;gap:7px}.form input,.form select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.form .full{grid-column:1/-1}
@media(max-height:700px){.totem{height:100vh;border:0;border-radius:0}}@media(max-width:430px){.totem{width:100vw}}
</style>
</head>
<body>
<div class="totem">
<section id="home" class="tela ativa">
  <div class="logo">SABOR TOTAL</div>
  <div class="hero">🍔🔥</div>
  <button class="btn-start" onclick="ir('escolha')">TOQUE PARA COMEÇAR</button>
  <div id="conexao" class="small-status">Conectando à planilha...</div>
</section>

<section id="escolha" class="tela">
  <h2>Como deseja receber?</h2>
  <div class="opcoes">
    <button class="opcao" onclick="definirTipo('LOCAL')"><div class="ico">🍽️</div>Comer no local</button>
    <button class="opcao" onclick="definirTipo('LEVAR')"><div class="ico">🛍️</div>Para levar</button>
  </div>
</section>

<section id="cardapio" class="tela">
  <div class="top"><button class="back" onclick="ir('escolha')">←</button>CARDÁPIO</div>
  <div class="form">
    <input id="nome" placeholder="Nome (opcional)">
    <input id="whatsapp" placeholder="WhatsApp (opcional)">
    <select id="tipo" class="full"><option value="LOCAL">Comer no local</option><option value="LEVAR">Para levar</option></select>
  </div>
  <div id="cats" class="cats"></div>
  <div id="produtos" class="produtos"><div style="grid-column:1/-1;text-align:center;padding:30px">Carregando...</div></div>
  <div class="rodape">
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <div class="acoes"><button class="limpar" onclick="limpar()">Limpar</button><button class="pagar" onclick="finalizar()">Pagar com PIX</button></div>
  </div>
</section>

<section id="pix" class="tela">
  <div class="pix-title">PEDIDO <span id="pedidoId"></span></div>
  <div class="valor">R$ <span id="valorPix">0,00</span></div>
  <div id="status" class="status pend">⏳ Aguardando confirmação do pagamento...</div>
  <div id="timer" class="timer">Verificando automaticamente...</div>
  <div id="qr" class="qr"><div id="qrcode"></div></div>
  <div id="pixcode" class="code" onclick="copiarPix()">Clique para copiar o PIX</div>
  <div class="pix-actions">
    <button class="cancel" onclick="cancelar()">Cancelar</button>
    <button id="novo" class="new" onclick="novaVenda()">Nova venda</button>
  </div>
</section>
</div>

<script>
/* ============================================================
   COLOQUE A URL /exec DO SEU GOOGLE APPS SCRIPT AQUI
   Ex.: https://script.google.com/macros/s/SEU_ID/exec
   ============================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyHxtCB4PI4e4uwun7X-IQZQAwmVjGJgVMzT5fcjAIprPUCo4otIgxBQgO27zStk8AF/exec';

let produtos=[], carrinho=[], categoria='Todos', tipoPedido='LOCAL';
let pedidoAtual='', pixAtual='', timer=null, segundos=0, confirmado=false;

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{delete window[cb];script.remove();reject(new Error('Tempo limite de conexão'));},15000);
    window[cb]=data=>{clearTimeout(timeout);delete window[cb];script.remove();resolve(data)};
    script.onerror=()=>{clearTimeout(timeout);delete window[cb];script.remove();reject(new Error('Falha de comunicação com a planilha'))};
    script.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(script);
  });
}
function api(action,params={}){
  const q=new URLSearchParams({action,...params});
  return jsonp(SCRIPT_URL+'?'+q.toString());
}
function ir(id){
  document.querySelectorAll('.tela').forEach(x=>x.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}
function definirTipo(t){
  tipoPedido=t;document.getElementById('tipo').value=t;ir('cardapio');carregarProdutos();
}
async function carregarProdutos(){
  if(!SCRIPT_URL||SCRIPT_URL.includes('COLE_AQUI')){
    document.getElementById('conexao').textContent='Configure a URL do Web App no index.html';
    return;
  }
  try{
    const r=await api('getProdutos');
    if(!r.success) throw new Error(r.mensagem||'Erro');
    produtos=r.data||[];
    document.getElementById('conexao').textContent='✅ Planilha conectada';
    renderCats();renderProdutos();
  }catch(e){
    document.getElementById('conexao').textContent='❌ '+e.message;
    document.getElementById('produtos').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#c00">Não foi possível carregar o cardápio.</div>';
  }
}
function renderCats(){
  const cats=[...new Set(produtos.map(p=>p.categoria||'Geral'))];
  document.getElementById('cats').innerHTML=
    '<button class="cat on" onclick="filtrar(\'Todos\',this)">Todos</button>'+
    cats.map(c=>`<button class="cat" onclick="filtrar(${JSON.stringify(c)},this)">${esc(c)}</button>`).join('');
}
function filtrar(c,el){categoria=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderProdutos()}
function renderProdutos(){
  const list=produtos.filter(p=>categoria==='Todos'||p.categoria===categoria);
  const box=document.getElementById('produtos');
  if(!list.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px">Nenhum produto disponível.</div>';return}
  box.innerHTML=list.map(p=>{
    const img=p.imagem?`<img class="prod-img" src="${escAttr(p.imagem)}" onerror="this.outerHTML='<div class=prod-img>🍽️</div>'">`:'<div class="prod-img">🍽️</div>';
    return `<div class="produto">${img}<div class="prod-nome">${esc(p.nome)}</div><div class="prod-desc">${esc(p.descricao||'')}</div><div class="preco">R$ ${money(p.preco)}</div><button class="add" onclick="adicionar('${escAttr(p.id)}')">Adicionar</button></div>`;
  }).join('');
}
function adicionar(id){
  const p=produtos.find(x=>x.id===id);if(!p)return;
  const item=carrinho.find(x=>x.id===id);
  if(item)item.qtd++;else carrinho.push({id,qtd:1});
  atualizarTotal();
}
function atualizarTotal(){
  let total=0;
  carrinho.forEach(i=>{const p=produtos.find(x=>x.id===i.id);if(p)total+=p.preco*i.qtd});
  document.getElementById('total').textContent='R$ '+money(total);
}
function limpar(){carrinho=[];atualizarTotal()}
async function finalizar(){
  if(!carrinho.length){alert('Adicione pelo menos um produto.');return}
  const nome=document.getElementById('nome').value.trim()||'Cliente Totem';
  const whatsapp=document.getElementById('whatsapp').value.trim();
  const tipo=document.getElementById('tipo').value;
  try{
    const r=await api('criarPedido',{nome,whatsapp,tipo,itens:JSON.stringify(carrinho)});
    if(!r.success)throw new Error(r.mensagem||'Não foi possível criar o pedido');
    pedidoAtual=r.data.orderId;pixAtual=r.data.pixCode;
    mostrarPix(r.data); 
  }catch(e){alert('Erro: '+e.message)}
}
function mostrarPix(data){
  confirmado=false;segundos=0;
  document.getElementById('pedidoId').textContent=data.orderId;
  document.getElementById('valorPix').textContent=money(data.valor);
  document.getElementById('pixcode').textContent=data.pixCode;
  document.getElementById('status').className='status pend';
  document.getElementById('status').textContent='⏳ Aguardando confirmação do pagamento...';
  document.getElementById('novo').style.display='none';
  const qr=document.getElementById('qrcode');qr.innerHTML='';
  new QRCode(qr,{text:data.pixCode,width:170,height:170});
  ir('pix');
  clearInterval(timer);
  timer=setInterval(verificar,5000);
  verificar();
}
async function verificar(){
  if(!pedidoAtual || confirmado)return;
  segundos+=5;
  document.getElementById('timer').textContent='⏱️ Procurando pagamento Nubank... '+segundos+'s';
  try{
    // O backend consulta o Gmail e procura exatamente o remetente
    // todomundo@nubank.com.br após a geração deste PIX.
    const r=await api('verificarPagamento',{id:pedidoAtual});
    if(r.success){
      atualizarStatusSite(r.status||'');
      if(r.pago){
        document.getElementById('timer').textContent='✅ Email do Nubank recebido. Pagamento confirmado!';
      }
    }
  }catch(e){
    document.getElementById('timer').textContent='⏳ Aguardando email do Nubank...';
  }
}
function atualizarStatusSite(status){
  const s=String(status||'').toUpperCase();
  const box=document.getElementById('status');

  if(s==='PAGO'){
    confirmado=true;
    box.className='status pago';
    box.textContent='✅ PAGAMENTO CONFIRMADO!';
    document.getElementById('timer').textContent='Pedido liberado para preparo.';
    document.getElementById('novo').style.display='block';
    carrinho=[];atualizarTotal();
  }else if(s==='EM PREPARO'){
    confirmado=true;
    box.className='status pago';
    box.textContent='👨‍🍳 PEDIDO EM PREPARO';
    document.getElementById('timer').textContent='Sua compra está sendo preparada.';
    document.getElementById('novo').style.display='block';
  }else if(s==='PRONTO'){
    confirmado=true;
    box.className='status pago';
    box.textContent='🎉 PEDIDO PRONTO!';
    document.getElementById('timer').textContent='Pode retirar / seguir para a próxima etapa.';
    document.getElementById('novo').style.display='block';
  }else if(s==='CANCELADO'){
    box.className='status';
    box.textContent='❌ PEDIDO CANCELADO';
    document.getElementById('timer').textContent='Este pedido foi cancelado.';
    document.getElementById('novo').style.display='block';
  }
}
async function cancelar(){
  if(!pedidoAtual)return;
  if(!confirm('Cancelar este pedido?'))return;
  try{
    await api('cancelarPedido',{id:pedidoAtual});
  }catch(e){}
  clearInterval(timer);carrinho=[];atualizarTotal();novaVenda();
}
function novaVenda(){
  clearInterval(timer);pedidoAtual='';pixAtual='';confirmado=false;
  document.getElementById('nome').value='';document.getElementById('whatsapp').value='';
  ir('home');carregarProdutos();
}
function copiarPix(){
  navigator.clipboard.writeText(pixAtual).then(()=>alert('PIX copiado!')).catch(()=>alert('Selecione e copie o código PIX.'));
}
function money(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(v){return esc(v)}
window.addEventListener('load', carregarProdutos);
setInterval(() => {
  if (document.getElementById('cardapio').classList.contains('ativa')) carregarProdutos();
}, 30000);
</script>
</body>
</html>
