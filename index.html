<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Sabor Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primaria: #FF6B35;
            --secundaria: #1F2937;
            --fundo: #F3F4F6;
            --branco: #FFFFFF;
            --verde: #10B981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .totem {
            width: 420px; height: 850px; background-color: var(--fundo);
            border-radius: 25px; position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 10px solid var(--secundaria);
            display: flex; flex-direction: column;
        }

        .tela { display: none; flex-direction: column; height: 100%; width: 100%; animation: fadeIn 0.3s ease; }
        .tela.ativa { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TELA 1: HOME */
        #home { background: linear-gradient(160deg, var(--primaria), #ff9f68); align-items: center; justify-content: center; text-align: center; color: white; padding: 20px; }
        .logo-marca { font-size: 55px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        .tagline { font-size: 16px; opacity: 0.9; margin-bottom: 40px; }
        .banner-home { font-size: 100px; margin-bottom: 40px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }
        .botao-iniciar { background: var(--branco); color: var(--primaria); border: none; padding: 20px 50px; font-size: 20px; font-weight: 800; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .botao-iniciar:hover { transform: scale(1.05); }
        .info-rodape { position: absolute; bottom: 20px; font-size: 12px; opacity: 0.7; }

        /* TELA 2: ESCOLHA */
        #escolha { background-color: var(--branco); align-items: center; padding-top: 60px; justify-content: center; }
        .titulo-escolha { font-size: 28px; font-weight: 800; color: var(--secundaria); margin-bottom: 50px; }
        .opcoes { display: flex; gap: 20px; width: 90%; }
        .botao-opcao { flex: 1; height: 300px; background-color: var(--fundo); border: 2px solid #E5E7EB; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; font-size: 17px; font-weight: 800; color: var(--secundaria); transition: all 0.3s; }
        .botao-opcao:hover { border-color: var(--primaria); background-color: #FFF7F2; color: var(--primaria); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,107,53,0.15); }
        .icone-opcao { font-size: 80px; background: white; padding: 25px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }

        /* TELA 3: CARDÁPIO */
        #cardapio { background-color: var(--fundo); }
        .header-cardapio { background-color: var(--secundaria); color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: 800; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; }
        .botao-voltar { position: absolute; left: 15px; top: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .botao-voltar:hover { background: rgba(255,255,255,0.4); }
        
        .area-produtos { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-content: start; }
        
        .produto { background: var(--branco); border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .produto:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        
        .icone-produto { font-size: 55px; margin: 10px auto; height: 60px; display: flex; align-items: center; justify-content: center; }
        .nome-produto { font-weight: 800; font-size: 14px; color: var(--secundaria); margin-bottom: 5px; line-height: 1.3; min-height: 36px; }
        .preco-produto { font-size: 18px; font-weight: 800; color: var(--primaria); margin-bottom: 10px; }
        
        .adicionar-btn { background: var(--secundaria); color: white; border: none; border-radius: 10px; padding: 10px; cursor: pointer; font-weight: 700; font-size: 14px; transition: background 0.2s; }
        .adicionar-btn:hover { background: var(--primaria); }

        /* RODAPÉ CARDÁPIO / CARRINHO */
        .rodape-cardapio { background: var(--branco); padding: 15px; border-top: 2px solid #E5E7EB; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); z-index: 10; }
        .linha-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; color: var(--secundaria); }
        .botoes-rodape { display: flex; gap: 10px; }
        .botao-limpar { flex: 1; background: #F3F4F6; border: 2px solid #E5E7EB; border-radius: 10px; padding: 12px; cursor: pointer; color: var(--secundaria); font-weight: 700; font-size: 14px; transition: 0.2s; }
        .botao-limpar:hover { background: #E5E7EB; }
        .botao-finalizar { flex: 2; background: var(--verde); color: white; border: none; border-radius: 10px; padding: 12px; cursor: pointer; font-weight: 800; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .botao-finalizar:hover { background: #059669; }

        /* TELA 4: SUCESSO */
        #sucesso { background: var(--verde); color: white; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .icone-sucesso { font-size: 120px; margin-bottom: 20px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2)); }
        .botao-reiniciar { background: var(--branco); color: var(--verde); border: none; border-radius: 50px; padding: 15px 40px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

<div class="totem">
    
    <!-- TELA HOME -->
    <div id="home" class="tela ativa">
        <div class="logo-marca">SABOR TOTAL</div>
        <div class="tagline">O melhor fast food da cidade</div>
        <div class="banner-home">🍔🔥</div>
        <button class="botao-iniciar" onclick="navegar('escolha')">TOQUE PARA COMEÇAR</button>
        <div class="info-rodape">Pedidos via Totem • Pagamento na retirada</div>
    </div>

    <!-- TELA ESCOLHA -->
    <div id="escolha" class="tela">
        <h2 class="titulo-escolha">Como deseja receber?</h2>
        <div class="opcoes">
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🍽️</div>
                Comer no local
            </button>
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🥡</div>
                Para levar
            </button>
        </div>
    </div>

    <!-- TELA CARDÁPIO -->
    <div id="cardapio" class="tela">
        <div class="header-cardapio">
            <button class="botao-voltar" onclick="navegar('escolha')">&larr; Voltar</button>
            NOSSO CARDÁPIO
        </div>
        
        <div class="area-produtos" id="listaProdutos">
            <p style="grid-column: span 2; text-align: center; margin-top: 50px; color: #666; font-weight: 600;">Carregando cardápio...</p>
        </div>

        <div class="rodape-cardapio">
            <div class="linha-total">
                <span>Total:</span>
                <span id="totalCarrinho">R$ 0,00</span>
            </div>
            <div class="botoes-rodape">
                <button class="botao-limpar" onclick="limparCarrinho()">Limpar</button>
                <button class="botao-finalizar" onclick="finalizarPedido()">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <!-- TELA SUCESSO -->
    <div id="sucesso" class="tela">
        <div class="icone-sucesso">✅</div>
        <h2 style="margin-bottom: 10px;">Pedido Realizado!</h2>
        <p style="opacity: 0.9;">Retire seu pedido no balcão.</p>
        <button class="botao-reiniciar" onclick="navegar('home')">Fazer Novo Pedido</button>
    </div>

</div>

<script>
    // COLE AQUI O SEU LINK /exec ATUALIZADO
    const URL_API = "https://script.google.com/macros/s/AKfycby3b1lovwkQpZ4ZZS9ydVFypRuia8JHOXqOM_RLimMInDSBMD5oStAeaoNjtGJYFI8f/exec";

    let carrinho = [];
    let produtos = [];

    // Função para buscar os dados do Apps Script
    async function carregarProdutos() {
        try {
            const resposta = await fetch(URL_API);
            
            // Verifica se a resposta foi bem-sucedida
            if (!resposta.ok) {
                throw new Error(`Erro HTTP: ${resposta.status}`);
            }
            
            const dados = await resposta.json();
            
            if (Array.isArray(dados)) {
                produtos = dados;
            } else {
                throw new Error("Formato de dados inválido");
            }

            renderizarCardapio();

        } catch (erro) {
            console.error("Erro detalhado:", erro);
            document.getElementById('listaProdutos').innerHTML = '<p style="grid-column: span 2; text-align: center; color: #EF4444; margin-top: 50px; font-weight: 700;">Erro ao conectar. Verifique se o script está publicado e com acesso público.</p>';
        }
    }

    function renderizarCardapio() {
        const container = document.getElementById('listaProdutos');
        container.innerHTML = '';

        produtos.forEach((produto, index) => {
            const div = document.createElement('div');
            div.className = 'produto';
            div.innerHTML = `
                <div class="icone-produto">${produto.emoji || '🍽️'}</div>
                <div class="nome-produto">${produto.nome}</div>
                <div class="preco-produto">R$ ${parseFloat(produto.preco).toFixed(2)}</div>
                <button class="adicionar-btn" onclick="adicionarAoCarrinho(${index})">Adicionar</button>
            `;
            container.appendChild(div);
        });
    }

    function adicionarAoCarrinho(index) {
        const produto = produtos[index];
        carrinho.push(produto);
        atualizarTotal();
    }

    function limparCarrinho() {
        carrinho = [];
        atualizarTotal();
    }

    function atualizarTotal() {
        let total = 0;
        carrinho.forEach(item => total += parseFloat(item.preco));
        document.getElementById('totalCarrinho').innerText = `R$ ${total.toFixed(2)}`;
    }

    function finalizarPedido() {
        if (carrinho.length === 0) {
            alert("Adicione pelo menos um item ao carrinho!");
            return;
        }
        navegar('sucesso');
        limparCarrinho();
    }

    function navegar(idTela) {
        document.querySelectorAll('.tela').forEach(tela => tela.classList.remove('ativa'));
        document.getElementById(idTela).classList.add('ativa');
    }

    window.onload = carregarProdutos;
</script>

</body>
</html>
