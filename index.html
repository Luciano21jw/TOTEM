<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Sabor Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primaria: #FF5733; --secundaria: #2C3E50; --fundo: #F4F4F4; --branco: #FFF; --verde: #28A745; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .totem { width: 420px; height: 850px; background: var(--fundo); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 8px solid var(--secundaria); display: flex; flex-direction: column; position: relative; }
        
        .tela { display: none; flex-direction: column; height: 100%; width: 100%; }
        .tela.ativa { display: flex; }

        /* Home */
        #home { background: linear-gradient(135deg, var(--primaria), #ff8c42); align-items: center; justify-content: center; text-align: center; color: white; }
        .logo-marca { font-size: 50px; font-weight: 800; margin-bottom: 20px; }
        .banner-home { font-size: 80px; margin-bottom: 30px; }
        .botao-iniciar { background: white; color: var(--secundaria); border: none; padding: 20px 40px; font-size: 20px; font-weight: 800; border-radius: 50px; cursor: pointer; }

        /* Escolha */
        #escolha { background: white; align-items: center; justify-content: center; padding: 20px; }
        .titulo-escolha { font-size: 28px; font-weight: 800; color: var(--secundaria); margin-bottom: 40px; }
        .opcoes { display: flex; gap: 15px; width: 100%; }
        .botao-opcao { flex: 1; height: 250px; background: var(--fundo); border: 3px solid #ddd; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-weight: 800; color: var(--secundaria); }
        .icone-opcao { font-size: 70px; background: white; padding: 20px; border-radius: 50%; }

        /* Cardápio */
        #cardapio { background: var(--fundo); }
        .header-cardapio { background: var(--secundaria); color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; position: relative; }
        .botao-voltar { position: absolute; left: 15px; top: 15px; background: none; border: 2px solid white; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        
        .area-produtos { flex: 1; padding: 15px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
        .produto { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .icone-produto { font-size: 45px; margin: 10px auto; }
        .nome-produto { font-weight: bold; font-size: 13px; color: var(--secundaria); margin-bottom: 5px; }
        .preco-produto { font-size: 16px; font-weight: 800; color: var(--primaria); margin-bottom: 8px; }
        .adicionar-btn { background: var(--secundaria); color: white; border: none; border-radius: 6px; padding: 8px; cursor: pointer; font-weight: bold; }

        /* Carrinho / Pagamento */
        .rodape-cardapio { background: white; padding: 12px; border-top: 2px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .linha-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--secundaria); }
        .botoes-rodape { display: flex; gap: 10px; }
        .botao-limpar { flex: 1; background: #eee; border: none; border-radius: 5px; padding: 10px; cursor: pointer; font-weight: bold; }
        .botao-finalizar { flex: 2; background: var(--verde); color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; font-weight: 800; }

        /* Tela PIX */
        #pix { background: white; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .qrcode-box { background: #eee; padding: 20px; border-radius: 15px; margin: 20px 0; }
        .pix-codigo { background: #f4f4f4; padding: 10px; border-radius: 5px; font-size: 12px; word-break: break-all; margin-bottom: 20px; }
        .botao-copiar { background: var(--secundaria); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Tela Sucesso */
        #sucesso { background: var(--verde); color: white; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .icone-sucesso { font-size: 100px; margin-bottom: 20px; }
        .botao-reiniciar { background: white; color: var(--verde); border: none; border-radius: 50px; padding: 15px 40px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

<div class="totem">
    <!-- HOME -->
    <div id="home" class="tela ativa">
        <div class="logo-marca">SABOR TOTAL</div>
        <div class="banner-home">🍔🔥</div>
        <button class="botao-iniciar" onclick="navegar('escolha')">TOQUE PARA COMEÇAR</button>
    </div>

    <!-- ESCOLHA -->
    <div id="escolha" class="tela">
        <h2 class="titulo-escolha">Como deseja receber?</h2>
        <div class="opcoes">
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🍽️</div> Comer no local
            </button>
            <button class="botao-opcao" onclick="navegar('cardapio')">
                <div class="icone-opcao">🛍️</div> Para levar
            </button>
        </div>
    </div>

    <!-- CARDÁPIO -->
    <div id="cardapio" class="tela">
        <div class="header-cardapio">
            <button class="botao-voltar" onclick="navegar('escolha')">&larr; Voltar</button>
            NOSSO CARDÁPIO
        </div>
        <div class="area-produtos" id="listaProdutos"></div>

        <div class="rodape-cardapio">
            <div class="linha-total"><span>Total:</span><span id="totalCarrinho">R$ 0,00</span></div>
            <div class="botoes-rodape">
                <button class="botao-limpar" onclick="limparCarrinho()">Limpar</button>
                <button class="botao-finalizar" onclick="irParaPagamento()">Pagar</button>
            </div>
        </div>
    </div>

    <!-- TELA PIX -->
    <div id="pix" class="tela">
        <h2 style="color: var(--secundaria);">Pagamento via PIX</h2>
        <p style="color: #666; margin-bottom: 20px;">Escaneie o QR Code ou copie o código abaixo</p>
        <div class="qrcode-box"><div id="qrcode"></div></div>
        <p style="font-weight: bold;">Código Copia e Cola:</p>
        <div class="pix-codigo" id="pixCode"></div>
        <button class="botao-copiar" onclick="copiarPix()">Copiar Código PIX</button>
        <br><br>
        <p style="font-size: 12px; color: #888;">Após pagar, o status será atualizado automaticamente em instantes.</p>
    </div>

    <!-- SUCESSO -->
    <div id="sucesso" class="tela">
        <div class="icone-sucesso">✅</div>
        <h2>Pagamento Confirmado!</h2>
        <p style="margin-top: 15px;">Seu pedido está sendo preparado.</p>
        <button class="botao-reiniciar" onclick="navegar('home')">Fazer Novo Pedido</button>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzhquqEVnX_qNjFB510rdeQH_Du98uEDfEg2Y_-hOlOqYoB9CHrK6QDOvv0_insIngw/exec"; // Substitua pelo link /exec do seu script!
    let carrinho = [];
    let produtos = [];
    let pedidoAtual = null;

    async function carregarProdutos() {
        try {
            const resposta = await fetch(`${URL_API}?api=produtos`);
            const dados = await resposta.json();
            if (dados.success) {
                produtos = dados.data;
                renderizarCardapio();
            }
        } catch (e) {
            document.getElementById('listaProdutos').innerHTML = "<p style='color:red;'>Erro ao carregar.</p>";
        }
    }

    function renderizarCardapio() {
        const container = document.getElementById('listaProdutos');
        container.innerHTML = '';
        produtos.forEach((produto, index) => {
            const div = document.createElement('div');
            div.className = 'produto';
            div.innerHTML = `
                <div class="icone-produto">${produto.imagem ? `<img src="${produto.imagem}" style="width:60px; height:60px; border-radius:10px;">` : '🍽️'}</div>
                <div class="nome-produto">${produto.nome}</div>
                <div class="preco-produto">R$ ${parseFloat(produto.preco).toFixed(2)}</div>
                <button class="adicionar-btn" onclick="adicionarAoCarrinho(${index})">Adicionar</button>
            `;
            container.appendChild(div);
        });
    }

    function adicionarAoCarrinho(index) {
        carrinho.push(produtos[index]);
        atualizarTotal();
    }

    function limparCarrinho() { carrinho = []; atualizarTotal(); }

    function atualizarTotal() {
        let total = 0;
        carrinho.forEach(item => total += parseFloat(item.preco));
        document.getElementById('totalCarrinho').innerText = `R$ ${total.toFixed(2)}`;
    }

    async function irParaPagamento() {
        if (carrinho.length === 0) { alert("Adicione itens!"); return; }

        let total = 0;
        let itensStr = "";
        carrinho.forEach(item => { total += parseFloat(item.preco); itensStr += item.nome + ", "; });

        const pedidoData = {
            nome: "Cliente Totem",
            telefone: "0000000000",
            email: "totem@email.com",
            endereco: "Retirada no balcão",
            itens: itensStr,
            qtd: carrinho.length,
            valor: total.toFixed(2)
        };

        try {
            const resposta = await fetch(URL_API, {
                method: "POST",
                body: JSON.stringify({ api: "salvarpedido", data: pedidoData })
            });
            const dados = await resposta.json();

            if (dados.success) {
                pedidoAtual = dados.data;
                mostrarTelaPix(dados.data.pixCode);
            } else {
                alert("Erro: " + dados.mensagem);
            }
        } catch (e) {
            alert("Erro de conexão. Verifique o link do script.");
        }
    }

    function mostrarTelaPix(code) {
        navegar('pix');
        document.getElementById('pixCode').innerText = code;
        
        // Limpa e gera o QR Code
        const qrDiv = document.getElementById('qrcode');
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, { text: code, width: 200, height: 200 });

        // Verifica o pagamento automaticamente a cada 5 segundos
        let interval = setInterval(async () => {
            const resposta = await fetch(`${URL_API}?api=pedido&id=${pedidoAtual.orderId}`);
            const dados = await resposta.json();
            if (dados.success && dados.data && dados.data.status === "PAGO") {
                clearInterval(interval);
                navegar('sucesso');
                limparCarrinho();
            }
        }, 5000);
    }

    function copiarPix() {
        const code = document.getElementById('pixCode').innerText;
        navigator.clipboard.writeText(code);
        alert("Código PIX copiado!");
    }

    function navegar(idTela) {
        document.querySelectorAll('.tela').forEach(tela => tela.classList.remove('ativa'));
        document.getElementById(idTela).classList.add('ativa');
    }

    window.onload = carregarProdutos;
</script>
</body>
</html>
